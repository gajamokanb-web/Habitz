name: Build APK

on:
  push:
    branches: [main, port-compose]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong|Execution failed' -A2 build.log | head -60 | sed 's/^/::error::/' ;
            exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Habitz-v0.3.0-debug
          path: app/build/outputs/apk/debug/*.apk
